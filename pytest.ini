[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 用例层只负责编排，真正的请求/断言下沉到 core 与 api 层
addopts =
    -ra
    -v
    --strict-markers
    --tb=short

markers =
    smoke: 冒烟用例，发版前必跑
    regression: 回归用例，每日跑
    security: 越权 / 权限类用例
    framework: 框架自检用例（不依赖被测系统）
